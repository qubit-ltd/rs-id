[package]
name = "qubit-id"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-id"
description = "IoC-friendly synchronous and asynchronous ID generators for Snowflake-family IDs and UUID v4"
homepage = "https://github.com/qubit-ltd/rs-id"
documentation = "https://docs.rs/qubit-id"
readme = "README.md"
keywords = ["id", "snowflake", "uuid", "sonyflake", "qubit"]
categories = ["data-structures", "concurrency"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/benches/**",
    "/doc/**/user_guide*.md",
    "/docs/benchmarks/**",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_id"
doctest = true

[[bench]]
name = "qubit_snowflake_throughput"
path = "benches/qubit_snowflake_throughput/main.rs"
harness = false
required-features = ["qubit-snowflake"]

[[bench]]
name = "uuid_comparison"
path = "benches/uuid_comparison/main.rs"
harness = false
required-features = ["uuid"]

[features]
default = ["qubit-snowflake"]
qubit-snowflake = ["dep:parking_lot", "dep:qubit-clock"]
classic-snowflake = ["dep:parking_lot", "dep:qubit-clock"]
sonyflake = ["dep:parking_lot", "dep:qubit-clock"]
uuid = ["dep:uuid"]
tokio = ["dep:qubit-clock", "qubit-clock/tokio"]

[dependencies]
parking_lot = { version = "0.12", optional = true }
qubit-clock = { version = "0.9", path = "../rs-clock", optional = true }
thiserror = "2.0"
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "sync", "test-util", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
