[package]
name = "qubit-id"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-id"
description = "IoC-friendly Snowflake-family ID generators and synchronous UUID v4 generators"
homepage = "https://github.com/qubit-ltd/rs-id"
documentation = "https://docs.rs/qubit-id"
readme = "README.md"
keywords = ["id", "snowflake", "uuid", "sonyflake", "qubit"]
categories = ["data-structures", "concurrency"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "qubit_id"
doctest = true

[[bench]]
name = "qubit_snowflake_throughput"
path = "benches/qubit_snowflake_throughput/main.rs"
harness = false
required-features = ["qubit-snowflake"]

[[bench]]
name = "uuid_comparison"
path = "benches/uuid_comparison/main.rs"
harness = false
required-features = ["uuid"]

[features]
default = ["qubit-snowflake"]
qubit-snowflake = ["dep:parking_lot", "dep:qubit-clock"]
classic-snowflake = ["dep:parking_lot", "dep:qubit-clock"]
sonyflake = ["dep:parking_lot", "dep:qubit-clock"]
uuid = ["dep:getrandom", "dep:uuid"]
serde = ["dep:serde"]

[dependencies]
getrandom = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
qubit-clock = { version = "0.13", optional = true }
serde = { version = "1.0", optional = true }
thiserror = "2.0"
uuid = { version = "1.24", optional = true }

[dev-dependencies]
qubit-clock = { version = "0.13", features = ["test-util"] }
serde_json = "1.0"
serde_test = "1.0"
toml = "0.9"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "test-util", "time"] }
uuid = { version = "1.24", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
