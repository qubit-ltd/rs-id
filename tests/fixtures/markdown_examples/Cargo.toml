[package]
name = "qubit-id-markdown-examples"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
qubit-snowflake = ["qubit-id/qubit-snowflake", "dep:qubit-clock", "dep:tokio"]
classic-snowflake = ["qubit-id/classic-snowflake"]
sonyflake = ["qubit-id/sonyflake"]
uuid = ["qubit-id/uuid"]
serde = ["qubit-id/serde"]

[dependencies]
qubit-id = { path = "../../..", default-features = false }
qubit-clock = { version = "0.13", optional = true, features = ["tokio"] }
tokio = { version = "1.54", optional = true, features = ["macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
